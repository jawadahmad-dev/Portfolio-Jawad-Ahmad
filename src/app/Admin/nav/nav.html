<div class="admin-shell min-h-screen lg:flex">
    <!-- Sidebar (desktop) -->
    <aside class="sidebar sticky top-0 hidden h-screen w-64 shrink-0 flex-col lg:flex">
        <a routerLink="/" class="brand flex items-center gap-3 p-5" aria-label="View your portfolio site">
            <span class="brand__mark" aria-hidden="true">JW</span>
            <span>
                <span class="block font-bold leading-tight">Portfolio</span>
                <span class="block text-xs text-[var(--a-text-2)]">Admin</span>
            </span>
        </a>

        <nav class="flex-1 space-y-1 p-3" aria-label="Admin">
            @for (l of links; track l.path) {
            <a [routerLink]="l.path" routerLinkActive="nav-item--active" ariaCurrentWhenActive="page"
                class="nav-item flex items-center gap-3">
                <i [class]="l.icon" aria-hidden="true"></i>
                {{ l.label }}
            </a>
            }
        </nav>

        <div class="p-3">
            <div class="user-card flex items-center gap-3">
                <span class="user-card__avatar" aria-hidden="true">JW</span>
                <div class="min-w-0 flex-1">
                    <p class="text-sm font-semibold leading-tight">Admin</p>
                    <a routerLink="/" class="text-xs text-[var(--a-text-2)] hover:text-[var(--a-primary)]">View site</a>
                </div>
                <button pButton type="button" icon="pi pi-sign-out" class="icon-btn" aria-label="Log out"
                    (click)="confirmLogout()"></button>
            </div>
        </div>
    </aside>

    <!-- Top bar (mobile) -->
    <header class="topbar sticky top-0 z-20 lg:hidden">
        <div class="flex items-center justify-between px-4 py-3">
            <a routerLink="/" class="brand flex items-center gap-3" aria-label="View your portfolio site">
                <span class="brand__mark brand__mark--sm" aria-hidden="true">JW</span>
                <span class="font-bold">Portfolio admin</span>
            </a>
            <button pButton type="button" icon="pi pi-sign-out" class="icon-btn" aria-label="Log out"
                (click)="confirmLogout()"></button>
        </div>
        <nav class="flex gap-1 overflow-x-auto px-3 pb-3" aria-label="Admin">
            @for (l of links; track l.path) {
            <a [routerLink]="l.path" routerLinkActive="nav-item--active" ariaCurrentWhenActive="page"
                class="nav-item nav-item--compact shrink-0">{{ l.label }}</a>
            }
        </nav>
    </header>

    <main class="min-w-0 flex-1">
        <router-outlet />
    </main>
</div>
