<div class="relative w-screen h-screen flex items-center justify-center bg-bg overflow-hidden">
  <!-- Background Effects -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-40 -left-40 w-[32rem] h-[32rem] bg-primary/15 rounded-full blur-3xl animate-pulse">
    </div>
    <div class="absolute -bottom-40 -right-40 w-[32rem] h-[32rem] bg-accent/15 rounded-full blur-3xl animate-pulse">
    </div>
  </div>

  <!-- Main Centered Div -->
  <div class="relative w-full max-w-md sm:max-w-lg px-4 z-10">
    <!-- Glassmorphism Card -->
    <div
      class="rounded-3xl bg-bg-elevated/85 backdrop-blur-2xl border border-border p-8 sm:p-10 shadow-[var(--shadow-lg)]">
      <!-- Header -->
      <div class="flex flex-col items-center mb-8">
        <h2 class="text-3xl font-bold text-text tracking-tight">Welcome back</h2>
        <p class="text-muted text-sm mt-2">Sign in to continue to your account</p>
      </div>

      <form [formGroup]="signInForm" (ngSubmit)="onSubmit()" class="space-y-5 auth-form">
        <!-- Email -->
        <div class="flex flex-col gap-1.5">
          <label for="email" class="text-xs font-semibold text-muted tracking-wide uppercase">Email address</label>
          <p-iconfield class="w-full">
            <p-inputicon class="pi pi-envelope !text-primary" />
            <input pInputText id="email" type="email" formControlName="email" placeholder="john@example.com"
              class="w-full !bg-bg/80 !border-border !text-text placeholder:!text-subtle rounded-xl focus:!border-primary focus:!ring-2 focus:!ring-primary/30 transition-all duration-200" />
          </p-iconfield>
        </div>

        <!-- Password -->
        <div class="flex flex-col gap-1.5">
          <div class="flex items-center justify-between">
            <label for="password" class="text-xs font-semibold text-muted tracking-wide uppercase">Password</label>
          </div>
          <p-iconfield class="w-full">
            <p-inputicon class="pi pi-lock !text-primary" />
            <p-password formControlName="password" inputId="password" placeholder="Enter your password"
              [toggleMask]="true" [feedback]="false" styleClass="w-full"
              inputStyleClass="w-full !bg-bg/80 !border-border !text-text placeholder:!text-subtle rounded-xl
                               focus:!border-primary focus:!ring-2 focus:!ring-primary/30 transition-all duration-200" />
          </p-iconfield>
        </div>

        <!-- Submit Button -->
        <button type="submit"
          class="w-full cursor-pointer py-3 px-5 mt-2 bg-primary text-primary-contrast hover:bg-primary-hover disabled:bg-primary/50 disabled:cursor-not-allowed font-semibold rounded-xl shadow-lg shadow-primary/25 border border-transparent transition-all duration-200 hover:-translate-y-0.5 flex items-center justify-center gap-2">
          <span>Sign in</span>
          <i class="pi pi-arrow-right text-sm"></i>
        </button>
      </form>
    </div>
  </div>

</div>
