<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <script>
    try {
      var preference = localStorage.getItem('theme-preference') || 'system';
      var resolved = preference === 'system'
        ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : preference;
      document.documentElement.classList.toggle('dark', resolved === 'dark');
      document.documentElement.style.colorScheme = resolved;
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      if (themeMeta) themeMeta.setAttribute('content', resolved === 'dark' ? '#061319' : '#eff7f6');
    } catch (_) { }
  </script>
  <title>Jawad Ahmad | Full-Stack Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description"
    content="Portfolio of Jawad Ahmad - Full-Stack Developer crafting high-performance web applications with Angular, ASP.NET Core, and modern cloud technologies.">
  <meta name="theme-color" content="#061319">
  <link rel="icon" type="image/x-icon" href="webfav.png">
  <script type="module" src="https://unpkg.com/@le-pepe/snow-effect@0.1.13">
  </script>
</head>

<body class="bg-bg text-text selection:bg-primary-soft selection:text-primary antialiased">
  <app-root></app-root>
</body>

</html>
